# Cloudflare Worker + static assets
# Live: https://faa.kinai.workers.dev
name = "faa"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "public"
binding = "ASSETS"
# Worker handles /api/* first; static files for everything else
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
DAFREEAI_BASE_URL = "https://www.dafreeai.site"
