# Cloudflare Worker + static assets (local deploy from cf/)
# Live: https://faa.kinai.workers.dev
# NOTE: Git auto-deploy uses the ROOT wrangler.toml (../wrangler.toml)
name = "faa"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "public"
binding = "ASSETS"
# Worker always runs first so /api/* is handled by src/index.js
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
DAFREEAI_BASE_URL = "https://www.dafreeai.site"

[[kv_namespaces]]
binding = "KEYS"
id = "5700550db0684f859dec802784244461"
preview_id = "8fc3a15e500b44babc9b2c487f102d35"
