# Cloudflare Worker + static assets
# Live: https://faa.kinai.workers.dev
# Root config so Git-connected auto-deploy uses the correct Worker + assets
# (NOT the local Flask static/ folder)
name = "faa"
main = "cf/src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "cf/public"
binding = "ASSETS"
# Worker always runs first so /api/* is handled by cf/src/index.js
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
DAFREEAI_BASE_URL = "https://www.dafreeai.site"
